name: Angular Frontend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment: 
      name: production
      url: http://20.239.91.134

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check deployment secrets
      id: deployment-secrets
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}
        VM_HOST_IP: ${{ secrets.VM_HOST_IP }}
        VM_USERNAME: ${{ secrets.VM_USERNAME }}
        VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
      run: |
        if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ] && [ -n "$VM_HOST_IP" ] && [ -n "$VM_USERNAME" ] && [ -n "$VM_SSH_KEY" ]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Deployment secrets are missing. Skipping Docker image push and VM deployment."
        fi

    - name: Log in to Docker Hub
      if: steps.deployment-secrets.outputs.available == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME || secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      if: steps.deployment-secrets.outputs.available == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: thang1311/my-frontend:latest 

    - name: Deploy to Linux VM
      if: steps.deployment-secrets.outputs.available == 'true'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST_IP }}
        username: ${{ secrets.VM_USERNAME }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          # Di chuyển tới thư mục chứa file docker-compose.yml trên Server
          
          cd /home/azureuser/elearning-project
          
          # Kéo image frontend mới nhất từ Docker Hub về
          sudo docker compose pull frontend
          
          # Khởi động lại (nó sẽ chỉ update mỗi frontend)
          sudo docker compose up -d
